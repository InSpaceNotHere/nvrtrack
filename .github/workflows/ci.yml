name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Validate migrations with local Supabase (when Docker is available)
        shell: bash
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker not installed on this runner; skipping migration validation."
            exit 0
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "Docker daemon unavailable; skipping migration validation."
            exit 0
          fi
          supabase start
          supabase db reset --local --no-seed
          supabase stop
